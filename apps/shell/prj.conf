# compiler settings
CONFIG_ASSERT=y
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_COMPILER_SAVE_TEMPS=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# CONFIG_NEWLIB_LIBC=y
# CONFIG_COMMON_LIBC_ASCTIME_R=y
# CONFIG_COMMON_LIBC_CTIME_R=y
# CONFIG_COMMON_LIBC_MALLOC=y
# CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
# CONFIG_NEWLIB_LIBC_HEAP_LISTENER=y

# CONFIG_HEAP_MEM_POOL_SIZE=20000

# Debug settings
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=y

# shell settings
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="Reiki:~$ "

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y

CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

CONFIG_I2C=y
CONFIG_I2C_SHELL=y

CONFIG_SPI=y
CONFIG_SPI_SHELL=y

CONFIG_LED_GPIO=y
CONFIG_HT16K33=y
CONFIG_LED=y
CONFIG_LED_SHELL=y
